name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A second push to the same PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same image as release.yml, so a change that breaks the release build fails
  # here at review time rather than at tag time.
  frontend:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # `npm run build` is tsc followed by vite, so this is the typecheck too.
      - run: npm run build

  backend:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri's standard Linux set. No patchelf or librsvg here: nothing in this
      # workflow bundles anything, it only compiles and tests.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev \
            libayatana-appindicator3-dev libssl-dev

      # The frontend is never built in this job, so `dist/` is absent. That is
      # fine for a test build; only `tauri build` needs the bundle to exist.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The tree is clippy-clean, so warnings are worth failing on. `cargo fmt`
      # is deliberately not gated here: the existing source does not satisfy it,
      # and reformatting it wholesale would bury real changes in noise.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
